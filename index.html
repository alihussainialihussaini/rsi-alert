<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto Alert Board</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#262d36;--fg:#e6edf3;--mut:#8b96a3;--up:#26a69a;--dn:#ef5350;--acc:#f0b90b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:16px;margin:0;margin-right:auto}
button,select,input{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
button{cursor:pointer}button.on{border-color:var(--acc);color:var(--acc)}
#st{font-size:12px;color:var(--mut)}#st.ok{color:var(--up)}
main{flex:1;display:flex;min-height:0}
#chartwrap{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#sym{font-size:18px;font-weight:700}#px{color:var(--mut)}
#chart{flex:1;min-height:300px}
aside{width:340px;border-left:1px solid var(--line);overflow:auto;background:var(--panel)}
.a{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:pre-wrap;line-height:1.4}
.a:hover{background:#1d242d}.a b{color:var(--acc)}.a small{color:var(--mut)}
#toasts{position:fixed;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:9;max-width:340px}
.t{background:var(--panel);border:1px solid var(--acc);border-radius:8px;padding:10px 12px;white-space:pre-wrap;cursor:pointer;box-shadow:0 6px 20px #0008}
@media(max-width:800px){main{flex-direction:column}aside{width:100%;height:40%;border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<header><h1>Crypto Alert Board</h1>
<span id="st">connecting…</span>
<button id="en">Enable sound + popups</button></header>
<main>
<div id="chartwrap">
<div id="bar"><span id="sym">BTCUSDT</span><span id="px"></span>
<span style="flex:1"></span>
<button data-tf="15m">15m</button><button data-tf="1h" class="on">1h</button><button data-tf="4h">4h</button><button data-tf="1d">1d</button>
<input id="go" placeholder="coin e.g. SOL" size="9"></div>
<div id="chart"></div></div>
<aside id="list"></aside></main>
<div id="toasts"></div>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const TOPIC="rsi-alert-7h3kq9xw2m";
const OFF=5*3600; // Pakistan time
let sym="BTCUSDT",tf="1h",soundOn=false,seen=new Set(),timer;
const $=id=>document.getElementById(id);
const chart=LightweightCharts.createChart($("chart"),{layout:{background:{color:"#0e1116"},textColor:"#8b96a3"},grid:{vertLines:{color:"#1b2129"},horzLines:{color:"#1b2129"}},timeScale:{timeVisible:true,borderColor:"#262d36"},rightPriceScale:{borderColor:"#262d36"},autoSize:true});
const candles=chart.addCandlestickSeries({upColor:"#26a69a",downColor:"#ef5350",wickUpColor:"#26a69a",wickDownColor:"#ef5350",borderVisible:false});
async function load(){
  $("sym").textContent=sym;
  try{
    const r=await fetch("https://data-api.binance.vision/api/v3/klines?symbol="+sym+"&interval="+tf+"&limit=500");
    const k=await r.json();
    if(!Array.isArray(k))throw 0;
const lp=+k[k.length-1][4],pr=Math.max(2,Math.min(8,4-Math.floor(Math.log10(lp))));candles.applyOptions({priceFormat:{type:"price",precision:pr,minMove:1/Math.pow(10,pr)}});
    candles.setData(k.map(x=>({time:x[0]/1000+OFF,open:+x[1],high:+x[2],low:+x[3],close:+x[4]})));
    $("px").textContent=k[k.length-1][4];
  }catch(e){$("px").textContent="no data for "+sym}
  clearInterval(timer);timer=setInterval(tick,10000);
}
async function tick(){
  try{
    const r=await fetch("https://data-api.binance.vision/api/v3/klines?symbol="+sym+"&interval="+tf+"&limit=2");
    const k=await r.json();
    k.forEach(x=>candles.update({time:x[0]/1000+OFF,open:+x[1],high:+x[2],low:+x[3],close:+x[4]}));
    $("px").textContent=k[k.length-1][4];
  }catch(e){}
}
function show(s){s=s.toUpperCase().replace(/[^A-Z0-9]/g,"");if(!s)return;if(!/USDT$/.test(s))s+="USDT";sym=s;load()}
document.querySelectorAll("[data-tf]").forEach(b=>b.onclick=()=>{tf=b.dataset.tf;document.querySelectorAll("[data-tf]").forEach(x=>x.classList.toggle("on",x===b));load()});
$("go").onkeydown=e=>{if(e.key==="Enter"){show($("go").value);$("go").value=""}};
function coins(msg){const out=[];msg.split("\n").forEach(l=>{const m=l.trim().match(/^([A-Z0-9]{2,15})$/);if(m)out.push(m[1])});return out}
function fmt(t){return new Date(t*1000).toLocaleString("en-US",{timeZone:"Asia/Karachi",hour:"numeric",minute:"2-digit",day:"numeric",month:"short",hour12:true})+" PKT"}
function beep(){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.25)}catch(e){}}
function add(m,live){
  if(seen.has(m.id))return;seen.add(m.id);
  const msg=m.message||"";const cs=coins(msg);
  const d=document.createElement("div");d.className="a";
  d.innerHTML="<small></small>\n<span></span>";
  d.firstChild.textContent=fmt(m.time)+(cs.length?"  ·  "+cs.join(", "):"");
  d.lastChild.textContent=msg;
  d.onclick=()=>{if(cs.length)show(cs[0])};
  $("list").prepend(d);
  if(live){
    const t=document.createElement("div");t.className="t";t.textContent=msg.slice(0,400);
    t.onclick=()=>{if(cs.length)show(cs[0]);t.remove()};
    $("toasts").appendChild(t);setTimeout(()=>t.remove(),20000);
    if(cs.length)show(cs[0]);
    if(soundOn){beep();try{new Notification(m.title||"Alert",{body:msg.slice(0,200)})}catch(e){}}
  }
}
$("en").onclick=()=>{soundOn=true;beep();$("en").textContent="Sound on";try{Notification.requestPermission()}catch(e){}};
function connect(){
  const es=new EventSource("https://ntfy.sh/"+TOPIC+"/sse?since=24h");
  let first=true;
  es.onopen=()=>{$("st").textContent="live";$("st").className="ok"};
  es.onerror=()=>{$("st").textContent="reconnecting…";$("st").className=""};
  es.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}if(m.event!=="message")return;add(m,!first)};
  es.addEventListener("open",()=>{setTimeout(()=>first=false,2500)});
  setTimeout(()=>first=false,4000);
}
load();connect();
</script></body></html>
