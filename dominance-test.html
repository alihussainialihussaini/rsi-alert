<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dominance Alerts</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#262d36;--fg:#e6edf3;--mut:#8b96a3;--up:#26a69a;--dn:#ef5350;--acc:#f0b90b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:16px;margin:0;margin-right:auto}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
button,select,input{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:inherit}
button{cursor:pointer}button:disabled{opacity:.5;cursor:default}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.pill.live{color:var(--up);border-color:var(--up)}.pill.scan{color:var(--acc);border-color:var(--acc)}.pill.err{color:var(--dn);border-color:var(--dn)}
#ov{display:flex;gap:18px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut)}
#ov b{color:var(--fg);font-size:15px;margin-right:4px}
#banner{padding:10px 14px;font-size:14px;border-bottom:1px solid var(--line)}
.cards{display:flex;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 16px;min-width:140px}
.card b{display:block;font-size:22px}.card span{font-size:12px;color:var(--mut)}
.up{color:var(--up)}.down{color:var(--dn)}.dim{color:var(--mut)}
#charts{display:flex;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.cw{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;flex:1;min-width:260px}
.cw h3{margin:0 0 6px;font-size:12px;color:var(--mut);font-weight:600}
svg{width:100%;height:70px;display:block}
#toolbar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
label.t{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--mut);cursor:pointer}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);color:var(--mut);font-weight:600;font-size:12px}
.st{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.st-off{color:var(--dn);border-color:var(--dn)}
.st-altweak{color:#ffa94d;border-color:#ffa94d}
.st-btcled{color:#74c0fc;border-color:#74c0fc}
.st-altseason{color:#3ddc97;border-color:#3ddc97}
.st-on{color:var(--up);border-color:var(--up)}
.st-mixed{color:var(--mut)}
#empty{padding:30px 14px;color:var(--mut);text-align:center}
footer{padding:12px 14px 30px;color:var(--mut);font-size:12px;line-height:1.5}
.hidden{display:none!important}
</style></head><body>
<header><h1>Dominance Alerts</h1><a href="index.html">← Chart board</a><a href="naztesting.html">RSI Scanner</a><span id="pill" class="pill">starting…</span>
<button id="refresh">Refresh now</button></header>
<div id="ov"><span><b id="ovBtc">—</b>BTC.D</span><span><b id="ovEth">—</b>ETH.D</span><span><b id="ovSt">—</b>Stables.D</span><span id="ovLast">last update: —</span></div>
<div id="banner"></div>
<div class="cards" id="cards"></div>
<div id="charts">
 <div class="cw"><h3>BTC.D</h3><svg id="svgBtc" viewBox="0 0 300 70" preserveAspectRatio="none"></svg></div>
 <div class="cw"><h3>ETH.D</h3><svg id="svgEth" viewBox="0 0 300 70" preserveAspectRatio="none"></svg></div>
 <div class="cw"><h3>Stables.D (USDT+USDC)</h3><svg id="svgSt" viewBox="0 0 300 70" preserveAspectRatio="none"></svg></div>
</div>
<div id="toolbar">
 <label class="t">MA length <select id="maLen"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option><option value="50">50</option></select></label>
 <label class="t">Poll every <select id="pollSec"><option value="60">60s</option><option value="120" selected>2 min</option><option value="300">5 min</option></select></label>
 <label class="t"><input type="checkbox" id="sound"> Sound + notification on regime change</label>
 <span class="sp" style="flex:1"></span>
 <button id="csv">Export CSV</button>
</div>
<div class="wrap"><table id="grid"><thead><tr><th>Time (PKT)</th><th>Regime</th><th>BTC.D</th><th>ETH.D</th><th>Stables.D</th></tr></thead><tbody></tbody></table></div>
<div id="empty" class="hidden">Collecting data — the first few points build the moving averages before a regime can be read.</div>
<footer id="foot"></footer>
<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem("dom."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("dom."+k,JSON.stringify(v))}catch(e){}}};

const CFG={maLen:store.get("maLen",20),pollMs:store.get("pollSec",120)*1000,keep:400};
$("maLen").value=CFG.maLen;$("pollSec").value=CFG.pollMs/1000;
let sound=store.get("sound",false);$("sound").checked=sound;

// rolling history per metric: [{t, v}]
let H=store.get("hist",{btc:[],eth:[],stables:[]});
let LOG=store.get("log",[]); // [{t, regime, btc, eth, stables}]
let lastRegime=store.get("lastRegime",null);
let lastFetch=0,fetching=false,errMsg="";

const fmtTime=ms=>ms?new Date(ms).toLocaleString("en-GB",{timeZone:"Asia/Karachi",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}):"—";
const fmtAgo=ms=>{if(!ms)return"—";const s=Math.max(0,Math.round((Date.now()-ms)/1000));return s<60?s+"s ago":s<3600?Math.floor(s/60)+"m ago":Math.floor(s/3600)+"h "+Math.floor(s%3600/60)+"m ago"};

function sma(arr,n){if(arr.length<n)return null;let s=0;for(let i=arr.length-n;i<arr.length;i++)s+=arr[i].v;return s/n}

const REGIME={
  off:{cls:"st-off",label:"Broad Risk-Off",desc:"Stables.D rising while BTC.D and ETH.D fall — capital exiting crypto into cash."},
  altweak:{cls:"st-altweak",label:"Alt Weakness",desc:"Stables.D rising while ETH.D falls — rotation out of alts into cash."},
  btcled:{cls:"st-btcled",label:"BTC-Led Risk-On",desc:"Stables.D falling, BTC.D rising, ETH.D falling — capital favors BTC only."},
  altseason:{cls:"st-altseason",label:"Alt Season Signal",desc:"Stables.D falling, ETH.D rising, BTC.D falling — rotation into ETH/alts."},
  on:{cls:"st-on",label:"Broad Risk-On",desc:"Stables.D falling, BTC.D and ETH.D both rising — capital entering across the board."},
  mixed:{cls:"st-mixed",label:"Mixed / Transition",desc:"No clean match — dominance metrics are pulling in different directions."}
};
function classify(btcUp,ethUp,stUp){
  if(stUp&&!btcUp&&!ethUp)return"off";
  if(stUp&&!ethUp)return"altweak";
  if(!stUp&&btcUp&&ethUp)return"on";
  if(!stUp&&btcUp&&!ethUp)return"btcled";
  if(!stUp&&!btcUp&&ethUp)return"altseason";
  return"mixed"}

function beep(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();[880,1175].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.connect(g);g.connect(ctx.destination);const t=ctx.currentTime+i*.18;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.start(t);o.stop(t+.17)});setTimeout(()=>ctx.close(),800)}catch(e){}}
function ping(title,body){beep();try{if("Notification" in window&&Notification.permission==="granted")new Notification(title,{body})}catch(e){}}

async function poll(force){
  if(fetching)return;
  if(!force&&Date.now()-lastFetch<CFG.pollMs)return;
  fetching=true;
  try{
    const r=await fetch("https://api.coingecko.com/api/v3/global");
    if(!r.ok)throw new Error("coingecko "+r.status);
    const j=await r.json();
    const p=j.data.market_cap_percentage;
    const btc=p.btc,eth=p.eth,st=(p.usdt||0)+(p.usdc||0);
    const t=Date.now();
    H.btc.push({t,v:btc});H.eth.push({t,v:eth});H.stables.push({t,v:st});
    for(const k of ["btc","eth","stables"])if(H[k].length>CFG.keep)H[k]=H[k].slice(-CFG.keep);
    store.set("hist",H);
    errMsg="";lastFetch=t;

    const btcMa=sma(H.btc,CFG.maLen),ethMa=sma(H.eth,CFG.maLen),stMa=sma(H.stables,CFG.maLen);
    let regime=null;
    if(btcMa!=null&&ethMa!=null&&stMa!=null){
      regime=classify(btc>btcMa,eth>ethMa,st>stMa);
      if(regime!==lastRegime){
        LOG.unshift({t,regime,btc,eth,stables:st});
        if(LOG.length>500)LOG=LOG.slice(0,500);
        store.set("log",LOG);
        if(lastRegime!==null&&sound)ping("Dominance regime: "+REGIME[regime].label,REGIME[regime].desc);
        lastRegime=regime;store.set("lastRegime",regime);
      }
    }
    renderOverview(btc,eth,st,btcMa,ethMa,stMa,regime);
    renderCharts();
    renderLog();
  }catch(e){errMsg=String(e.message||e);renderOverview(null,null,null,null,null,null,null)}
  finally{fetching=false}
}

function arrow(v,ma){if(v==null||ma==null)return'<span class="dim">—</span>';return v>ma?'<span class="up">▲ above MA</span>':'<span class="down">▼ below MA</span>'}
function renderOverview(btc,eth,st,btcMa,ethMa,stMa,regime){
  $("ovBtc").textContent=btc!=null?btc.toFixed(2)+"%":"—";
  $("ovEth").textContent=eth!=null?eth.toFixed(2)+"%":"—";
  $("ovSt").textContent=st!=null?st.toFixed(2)+"%":"—";
  $("ovLast").textContent="last update: "+(lastFetch?fmtTime(lastFetch)+" ("+fmtAgo(lastFetch)+")":"—");
  const p=$("pill");
  if(errMsg&&!lastFetch){p.className="pill err";p.textContent="No data"}
  else if(fetching){p.className="pill scan";p.textContent="Updating…"}
  else{p.className="pill live";p.textContent="Live"}
  $("refresh").disabled=fetching;

  $("cards").innerHTML=[
    ["BTC.D",btc,btcMa],["ETH.D",eth,ethMa],["Stables.D",st,stMa]
  ].map(([l,v,ma])=>'<div class="card"><b>'+(v!=null?v.toFixed(2)+"%":"—")+'</b><span>'+l+' · MA '+(ma!=null?ma.toFixed(2)+"%":"—")+' · '+arrow(v,ma)+'</span></div>').join("");

  const b=$("banner");
  if(errMsg){b.innerHTML='<b style="color:var(--dn)">Data problem:</b> '+errMsg;}
  else if(regime){const r=REGIME[regime];b.innerHTML='<span class="st '+r.cls+'" style="font-size:14px">'+r.label+'</span> &nbsp;<span class="dim">'+r.desc+'</span>'}
  else{b.innerHTML='<span class="dim">Collecting data for the moving averages ('+(H.btc.length)+'/'+CFG.maLen+' points)…</span>'}

  const empty=$("empty");empty.classList.toggle("hidden",!!regime||!!errMsg);
  $("foot").textContent="Times are Pakistan time (PKT). Source: CoinGecko /global market-cap dominance. MA length "+CFG.maLen+" · polling every "+(CFG.pollMs/1000)+"s. Not trade advice.";
}

function sparkline(svgId,arr){
  const svg=$(svgId);if(arr.length<2){svg.innerHTML="";return}
  const vals=arr.map(x=>x.v),mn=Math.min(...vals),mx=Math.max(...vals),span=(mx-mn)||1;
  const W=300,H=70,pad=4;
  const pts=arr.map((x,i)=>{
    const px=pad+(i/(arr.length-1))*(W-2*pad);
    const py=H-pad-((x.v-mn)/span)*(H-2*pad);
    return px.toFixed(1)+","+py.toFixed(1)}).join(" ");
  const last=arr[arr.length-1].v,first=arr[0].v,col=last>=first?"var(--up)":"var(--dn)";
  svg.innerHTML='<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="1.5"/>';
}
function renderCharts(){sparkline("svgBtc",H.btc);sparkline("svgEth",H.eth);sparkline("svgSt",H.stables)}

function renderLog(){
  $("grid").querySelector("tbody").innerHTML=LOG.slice(0,200).map(r=>{
    const rg=REGIME[r.regime];
    return '<tr><td><span class="dim">'+fmtTime(r.t)+'</span></td><td><span class="st '+rg.cls+'">'+rg.label+'</span></td>'
      +'<td>'+r.btc.toFixed(2)+'%</td><td>'+r.eth.toFixed(2)+'%</td><td>'+r.stables.toFixed(2)+'%</td></tr>'}).join("");
}

$("refresh").addEventListener("click",()=>poll(true));
$("maLen").addEventListener("change",e=>{CFG.maLen=Number(e.target.value);store.set("maLen",CFG.maLen);poll(true)});
$("pollSec").addEventListener("change",e=>{CFG.pollMs=Number(e.target.value)*1000;store.set("pollSec",CFG.pollMs/1000)});
$("sound").addEventListener("change",e=>{sound=e.target.checked;store.set("sound",sound);if(sound){beep();try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch(x){}}});
$("csv").addEventListener("click",()=>{
  const lines=["time,regime,btc_d,eth_d,stables_d"];
  for(const r of LOG)lines.push([new Date(r.t).toISOString(),REGIME[r.regime].label,r.btc,r.eth,r.stables].join(","));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv"}));a.download="dominance-log-"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"")+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)
});

renderLog();renderCharts();
poll(true);
setInterval(()=>poll(false),15000);
</script></body></html>
