name: RSI Alert

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - uses: actions/cache@v4
        with:
          path: state.json
          key: rsi-state-${{ github.run_id }}
          restore-keys: rsi-state-

      - name: Check RSI and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python - <<'PY'
          import os, json, time, bisect, requests
          from datetime import datetime, timezone, timedelta
          from concurrent.futures import ThreadPoolExecutor

          TOPIC = os.environ["NTFY_TOPIC"]
          TOP_N = 100                    # watch the 100 USDT coins with the highest 24h trading volume
          DEFAULT_SYMBOLS = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]  # used only if Binance's list cannot be loaded
          STABLES = {"USDC", "FDUSD", "TUSD", "USDP", "BUSD", "DAI", "EUR", "AEUR", "USD1", "XUSD",
                     "USDE", "PYUSD", "EURI", "RLUSD", "BFUSD", "USDS", "UST"}
          TIMEFRAMES = ["1h", "4h"]      # 1h = all alerts, 4h = trend only
          MINUTES = {"1h": 60, "4h": 240}
          LOOKBACK = {"1h": 2, "4h": 1}  # only for the very first run
          MAX_CATCHUP = 24 * 3600 * 1000 # after a long gap, look back at most 24 hours
          MAX_LINES = 25                 # max lines per coin in one notification
          MAX_CHARS = 3500               # max size of one notification
          MAX_MSGS = 10                  # max notifications per run
          PERIOD = 14
          RSI_LEVELS = [30, 40, 50, 70]
          EMA_PERIOD = 200
          LONG_RSI_PERIOD = 200          # the slow RSI line
          LONG_RSI_NEAR = 2              # alert only if the RSI 200 line is within 50 +/- 2 (use 100 for every cross)
          SR_LEFT = 5                    # support/resistance: a swing needs 5 lower/higher closes on each side
          SR_RIGHT = 5
          SR_WINDOW = 300                # only use swings from the last 300 hours
          SR_NEAR = 0.005                # "near" alert when price is within 0.5% of the level
          TREND_SWING = 3                # trend: swing highs/lows need 3 candles on each side
          TREND_FLAT = 0.005             # trend: 200 EMA moved less than 0.5% in 20 candles = flat = sideways
          FLAT_LOOK = 20
          TREND_HOLD = {"1h": 2, "4h": 1}  # a new 1h trend must hold 2 candles before it counts
          PUMP_PCT = 0.03                # fake pump: candle rises 3% or more ...
          VOL_AVG_N = 20                 # ... but its volume is below the average of the last 20 candles
          FAKE_WINDOW = 5                # fake breakout: price closes back through the level within 5 candles
          FVG_MIN = 0.002                # fair value gap must be at least 0.2% of price
          OB_MOVE = 0.02                 # order block: the candle before a 2%+ move
          OB_BACK = 3                    # look back at most 3 candles for the order block candle
          ZONE_WINDOW = 100              # a zone alerts only when price first returns within 100 candles
          PKT = timezone(timedelta(hours=5))
          SHORT = {"uptrend": "up", "downtrend": "down", "sideways": "side"}

          KRAKEN = {"BTCUSDT": "XBTUSDT", "ETHUSDT": "ETHUSDT", "SOLUSDT": "SOLUSDT"}
          KRAKEN_INT = {"1h": 60, "4h": 240}
          BINANCE_INT = {"1h": "1h", "4h": "4h"}
          BASES = ("https://data-api.binance.vision", "https://api.binance.com")

          def get_symbols():
              for base in BASES:
                  try:
                      r = requests.get(base + "/api/v3/ticker/24hr", timeout=20)
                      if r.status_code != 200:
                          raise Exception("status %s" % r.status_code)
                      rows = []
                      for t in r.json():
                          sym = t["symbol"]
                          if not sym.endswith("USDT") or sym[:-4] in STABLES:
                              continue
                          rows.append((float(t["quoteVolume"]), sym))
                      rows.sort(reverse=True)
                      if len(rows) >= 10:
                          return [sym for _, sym in rows[:TOP_N]]
                  except Exception:
                      continue
              return None

          # a candle is (open time ms, open, high, low, close, volume)
          def from_binance(sym, tf):
              for base in BASES:
                  try:
                      r = requests.get(base + "/api/v3/klines",
                                       params={"symbol": sym, "interval": BINANCE_INT[tf], "limit": 1000},
                                       timeout=15)
                      if r.status_code != 200:
                          raise Exception("status %s" % r.status_code)
                      rows = [(int(c[0]), float(c[1]), float(c[2]), float(c[3]), float(c[4]), float(c[5]))
                              for c in r.json()[:-1]]  # drop open candle
                      return rows, "Binance"
                  except Exception:
                      continue
              return None

          def from_kraken(sym, tf):
              if sym not in KRAKEN:
                  raise Exception("no data source for " + sym)
              r = requests.get("https://api.kraken.com/0/public/OHLC",
                               params={"pair": KRAKEN[sym], "interval": KRAKEN_INT[tf]},
                               timeout=15)
              r.raise_for_status()
              res = r.json()["result"]
              key = [k for k in res if k != "last"][0]
              rows = [(int(c[0]) * 1000, float(c[1]), float(c[2]), float(c[3]), float(c[4]), float(c[6]))
                      for c in res[key][:-1]]  # drop open candle
              return rows, "Kraken"

          def get_candles(sym, tf):
              return from_binance(sym, tf) or from_kraken(sym, tf)

          def fetch(job):
              sym, tf = job
              try:
                  return sym, tf, get_candles(sym, tf), None
              except Exception as e:
                  return sym, tf, None, e

          def rsi_series(closes, period):
              out = [None] * len(closes)
              if len(closes) <= period:
                  return out
              gains, losses = [], []
              for i in range(1, len(closes)):
                  d = closes[i] - closes[i - 1]
                  gains.append(max(d, 0))
                  losses.append(max(-d, 0))
              ag = sum(gains[:period]) / period
              al = sum(losses[:period]) / period
              out[period] = 100.0 if al == 0 else 100 - 100 / (1 + ag / al)
              for i in range(period, len(gains)):
                  ag = (ag * (period - 1) + gains[i]) / period
                  al = (al * (period - 1) + losses[i]) / period
                  out[i + 1] = 100.0 if al == 0 else 100 - 100 / (1 + ag / al)
              return out

          def ema_series(closes, period):
              out = [None] * len(closes)
              if len(closes) < period:
                  return out
              k = 2 / (period + 1)
              e = sum(closes[:period]) / period
              out[period - 1] = e
              for i in range(period, len(closes)):
                  e = closes[i] * k + e * (1 - k)
                  out[i] = e
              return out

          def swings(closes):
              highs, lows = [], []
              for j in range(SR_LEFT, len(closes) - SR_RIGHT):
                  left = closes[j - SR_LEFT:j]
                  right = closes[j + 1:j + SR_RIGHT + 1]
                  if closes[j] > max(left) and closes[j] >= max(right):
                      highs.append((j, closes[j]))
                  if closes[j] < min(left) and closes[j] <= min(right):
                      lows.append((j, closes[j]))
              return highs, lows

          def trend_labels(candles, es):
              # uptrend: above EMA200 + higher swing high and higher swing low
              # downtrend: below EMA200 + lower swing high and lower swing low
              # sideways: everything else, or when EMA200 is flat
              n = len(candles)
              hs, ls = [], []
              for j in range(TREND_SWING, n - TREND_SWING):
                  h, l = candles[j][2], candles[j][3]
                  lh = [candles[x][2] for x in range(j - TREND_SWING, j)]
                  rh = [candles[x][2] for x in range(j + 1, j + TREND_SWING + 1)]
                  ll = [candles[x][3] for x in range(j - TREND_SWING, j)]
                  rl = [candles[x][3] for x in range(j + 1, j + TREND_SWING + 1)]
                  if h > max(lh) and h >= max(rh):
                      hs.append((j, h))
                  if l < min(ll) and l <= min(rl):
                      ls.append((j, l))
              out = [None] * n
              ph = pl = 0
              for i in range(n):
                  while ph < len(hs) and hs[ph][0] + TREND_SWING <= i:
                      ph += 1
                  while pl < len(ls) and ls[pl][0] + TREND_SWING <= i:
                      pl += 1
                  e = es[i]
                  if e is None or i < FLAT_LOOK or es[i - FLAT_LOOK] is None or ph < 2 or pl < 2:
                      continue
                  if abs(e / es[i - FLAT_LOOK] - 1) < TREND_FLAT:
                      out[i] = "sideways"
                      continue
                  c = candles[i][4]
                  up = hs[ph - 1][1] > hs[ph - 2][1] and ls[pl - 1][1] > ls[pl - 2][1]
                  dn = hs[ph - 1][1] < hs[ph - 2][1] and ls[pl - 1][1] < ls[pl - 2][1]
                  out[i] = "uptrend" if (c > e and up) else "downtrend" if (c < e and dn) else "sideways"
              return out

          def hold_labels(labels, hold):
              # a trend only counts after it showed up on `hold` candles in a row
              out = [None] * len(labels)
              cur = None
              for i, lab in enumerate(labels):
                  if lab is not None and all(labels[x] == lab for x in range(max(0, i - hold + 1), i + 1)):
                      cur = lab
                  out[i] = cur
              return out

          def find_zones(candles, lo, n):
              # returns zones the price touched for the FIRST time: (kind, bottom, top, candle index of the touch)
              made = []
              for c in range(max(2, lo - ZONE_WINDOW), n):
                  o, h, l, cl = candles[c][1], candles[c][2], candles[c][3], candles[c][4]
                  a = candles[c - 2]
                  if l > a[2] and (l - a[2]) / cl >= FVG_MIN:
                      made.append(("bullish FVG", a[2], l, c))
                  if h < a[3] and (a[3] - h) / cl >= FVG_MIN:
                      made.append(("bearish FVG", h, a[3], c))
                  body = (cl - o) / o if o else 0
                  if body >= OB_MOVE:
                      for k in range(c - 1, max(-1, c - 1 - OB_BACK), -1):
                          if candles[k][4] < candles[k][1]:   # last red candle before the up move
                              made.append(("bullish order block / demand zone", candles[k][3], candles[k][2], c))
                              break
                  elif body <= -OB_MOVE:
                      for k in range(c - 1, max(-1, c - 1 - OB_BACK), -1):
                          if candles[k][4] > candles[k][1]:   # last green candle before the down move
                              made.append(("bearish order block / supply zone", candles[k][3], candles[k][2], c))
                              break
              out = []
              for kind, bot, top, c in made:
                  for k in range(c + 1, min(n, c + 1 + ZONE_WINDOW)):
                      if candles[k][3] <= top and candles[k][2] >= bot:
                          out.append((kind, bot, top, k))
                          break
              return out

          def notify(text):
              try:
                  r = requests.post("https://ntfy.sh/" + TOPIC, data=text.encode("utf-8"),
                                    headers={"Title": "RSI Alert", "Priority": "high"},
                                    timeout=15)
                  return r.status_code < 300
              except Exception as e:
                  print("notify error:", e)
                  return False

          def start_index(candles, tf, since, now_ms):
              n = len(candles)
              if since is None:
                  return max(1, n - LOOKBACK[tf])
              since = max(since, now_ms - MAX_CATCHUP)
              margin = 2 * MINUTES[tf] * 60000
              lo = n
              while lo > 1 and candles[lo - 1][0] + MINUTES[tf] * 60000 > since - margin:
                  lo -= 1
              return max(1, lo)

          def analyze(sym, res1, res4):
              candles, source = res1
              n = len(candles)
              if n < 2:
                  return None
              closes = [x[4] for x in candles]
              vols = [x[5] for x in candles]
              rs = rsi_series(closes, PERIOD)
              rl = rsi_series(closes, LONG_RSI_PERIOD)
              es = ema_series(closes, EMA_PERIOD)
              highs, lows = swings(closes)
              conf1 = hold_labels(trend_labels(candles, es), TREND_HOLD["1h"])

              conf4, candles4, close4 = None, None, []
              if res4 and len(res4[0]) > 2:
                  candles4 = res4[0]
                  es4 = ema_series([x[4] for x in candles4], EMA_PERIOD)
                  conf4 = hold_labels(trend_labels(candles4, es4), TREND_HOLD["4h"])
                  close4 = [x[0] + 4 * 3600000 for x in candles4]

              def trend4_at(close_ms):
                  if conf4 is None:
                      return ""
                  k = bisect.bisect_right(close4, close_ms) - 1
                  if k >= 0 and conf4[k]:
                      return " [4h %s]" % SHORT[conf4[k]]
                  return ""

              def sr_at(i):
                  p0 = closes[i - 1]
                  res = [v for j, v in highs if j + SR_RIGHT <= i - 1 and j >= i - SR_WINDOW and v > p0]
                  sup = [v for j, v in lows if j + SR_RIGHT <= i - 1 and j >= i - SR_WINDOW and v < p0]
                  return (min(res) if res else None), (max(sup) if sup else None)

              chk1 = "_chk|" + sym + "|1h"
              lo = start_index(candles, "1h", state.get(chk1), now_ms)
              chks = [chk1]
              found = []     # (candle close time ms, text)
              pending = {}

              def add(t, tfname, key, text, suffix, step_ms):
                  k = sym + "|" + tfname + "|" + key
                  if t > pending.get(k, state.get(k, 0)):
                      pending[k] = t
                      found.append((t + step_ms, text + suffix))

              H1 = 3600000
              for i in range(lo, n):
                  t = candles[i][0]
                  suffix = trend4_at(t + H1)
                  evs = []
                  r, rp = rs[i], rs[i - 1]
                  if r is not None and rp is not None:
                      for lvl in RSI_LEVELS:
                          if rp < lvl <= r:
                              evs.append(("rsi%d-up" % lvl, "RSI crossed UP %d (%.1f)" % (lvl, r)))
                          elif rp >= lvl > r:
                              evs.append(("rsi%d-down" % lvl, "RSI crossed DOWN %d (%.1f)" % (lvl, r)))
                  e, ep = es[i], es[i - 1]
                  if e is not None and ep is not None:
                      if closes[i - 1] <= ep and closes[i] > e:
                          evs.append(("ema-up", "Price crossed ABOVE EMA%d (%.6g)" % (EMA_PERIOD, e)))
                      elif closes[i - 1] >= ep and closes[i] < e:
                          evs.append(("ema-down", "Price crossed BELOW EMA%d (%.6g)" % (EMA_PERIOD, e)))
                  s, sp = rl[i], rl[i - 1]
                  if r is not None and rp is not None and s is not None and sp is not None \
                          and abs(s - 50) <= LONG_RSI_NEAR:
                      if rp <= sp and r > s:
                          evs.append(("rsi200-up", "RSI14 crossed UP RSI%d (RSI%d %.1f, RSI14 %.1f)" % (LONG_RSI_PERIOD, LONG_RSI_PERIOD, s, r)))
                      elif rp >= sp and r < s:
                          evs.append(("rsi200-down", "RSI14 crossed DOWN RSI%d (RSI%d %.1f, RSI14 %.1f)" % (LONG_RSI_PERIOD, LONG_RSI_PERIOD, s, r)))
                  # support / resistance: near and broke
                  p0 = closes[i - 1]
                  rlv, slv = sr_at(i)
                  if rlv is not None:
                      zone = rlv * (1 - SR_NEAR)
                      if closes[i] > rlv:
                          evs.append(("res-break|%.6g" % rlv, "Price BROKE ABOVE resistance %.6g" % rlv))
                      elif closes[i] >= zone and p0 < zone:
                          evs.append(("res-near|%.6g" % rlv, "Price NEAR resistance %.6g (may break up)" % rlv))
                  if slv is not None:
                      zone = slv * (1 + SR_NEAR)
                      if closes[i] < slv:
                          evs.append(("sup-break|%.6g" % slv, "Price BROKE BELOW support %.6g" % slv))
                      elif closes[i] <= zone and p0 > zone:
                          evs.append(("sup-near|%.6g" % slv, "Price NEAR support %.6g (may break down)" % slv))
                  # fake breakout: broke a level, then closed back through it within FAKE_WINDOW candles
                  for j in range(max(1, i - FAKE_WINDOW), i):
                      rj, sj = sr_at(j)
                      if rj is not None and closes[j] > rj and closes[i] <= rj \
                              and all(closes[x] > rj for x in range(j + 1, i)):
                          evs.append(("fake-up|%.6g" % rj, "Fake breakout? Broke above resistance %.6g, then closed back below" % rj))
                      if sj is not None and closes[j] < sj and closes[i] >= sj \
                              and all(closes[x] < sj for x in range(j + 1, i)):
                          evs.append(("fake-down|%.6g" % sj, "Fake breakdown? Broke below support %.6g, then closed back above" % sj))
                  # fake pump: price jumps but volume is below average
                  if i > VOL_AVG_N:
                      avg = sum(vols[i - VOL_AVG_N:i]) / VOL_AVG_N
                      jump = closes[i] / closes[i - 1] - 1 if closes[i - 1] else 0
                      if jump >= PUMP_PCT and avg > 0 and vols[i] < avg:
                          evs.append(("pump-lowvol", "Fake pump? Price +%.1f%% but volume only %.0f%% of the 20-candle average" % (jump * 100, vols[i] / avg * 100)))
                  # 1h trend change
                  if conf1[i] and conf1[i - 1] and conf1[i] != conf1[i - 1]:
                      evs.append(("trend|%s>%s" % (conf1[i - 1], conf1[i]), "TREND 1h changed: %s -> %s" % (conf1[i - 1], conf1[i])))
                  for key, text in evs:
                      add(t, "1h", key, text, suffix, H1)

              # order blocks, supply/demand zones and fair value gaps: first time price returns to them
              for kind, bot, top, k in find_zones(candles, lo, n):
                  if k >= lo:
                      add(candles[k][0], "1h", "zone|%s|%.6g-%.6g" % (kind, bot, top),
                          "Price entered %s %.6g - %.6g" % (kind, bot, top), trend4_at(candles[k][0] + H1), H1)

              # 4h trend change
              if conf4 is not None:
                  chk4 = "_chk|" + sym + "|4h"
                  chks.append(chk4)
                  lo4 = start_index(candles4, "4h", state.get(chk4), now_ms)
                  for i in range(lo4, len(candles4)):
                      if conf4[i] and conf4[i - 1] and conf4[i] != conf4[i - 1]:
                          add(candles4[i][0], "4h", "trend|%s>%s" % (conf4[i - 1], conf4[i]),
                              "TREND 4h changed: %s -> %s" % (conf4[i - 1], conf4[i]), "", 4 * H1)

              return found, pending, chks, closes[-1], rs[-1], source

          try:
              state = json.load(open("state.json"))
          except Exception:
              state = {}

          SYMBOLS = get_symbols()
          if SYMBOLS:
              state["_symbols"] = SYMBOLS
          else:
              SYMBOLS = state.get("_symbols") or DEFAULT_SYMBOLS
          print("watching", len(SYMBOLS), "coins")

          now_ms = int(time.time() * 1000)
          now_pkt = datetime.fromtimestamp(now_ms / 1000, PKT)
          sample = ""
          blocks = []   # one entry per coin that has alerts: (text, pending, chks)

          jobs = [(sym, tf) for sym in SYMBOLS for tf in TIMEFRAMES]
          with ThreadPoolExecutor(max_workers=10) as pool:
              results = list(pool.map(fetch, jobs))
          data = {}
          for sym, tf, result, err in results:
              if err is not None or not result:
                  print("error", sym, tf, err)
              else:
                  data[(sym, tf)] = result

          for sym in SYMBOLS:
              try:
                  if (sym, "1h") not in data:
                      continue
                  out = analyze(sym, data[(sym, "1h")], data.get((sym, "4h")))
                  if out is None:
                      continue
                  found, pending, chks, price, rsi_last, source = out
                  if sym == "BTCUSDT" and rsi_last is not None:
                      sample = "BTC 1h RSI %.1f (data: %s)" % (rsi_last, source)
                  if not found:
                      for c in chks:
                          state[c] = now_ms
                      continue
                  found.sort(key=lambda x: x[0])
                  lines = []
                  for cm, text in found:
                      close_t = datetime.fromtimestamp(cm / 1000, PKT)
                      fmt = "%-I:%M %p" if close_t.date() == now_pkt.date() else "%d %b %-I:%M %p"
                      lines.append(close_t.strftime(fmt) + " PKT  " + text)
                  extra = ""
                  if len(lines) > MAX_LINES:
                      extra = "(%d older alerts not shown)\n" % (len(lines) - MAX_LINES)
                      lines = lines[-MAX_LINES:]
                  text = "%s\n%s%s\nPrice: %.6g (%s PKT)\n" % (sym, extra, "\n".join(lines), price, now_pkt.strftime("%d %b %H:%M"))
                  blocks.append((text, pending, chks))
              except Exception as e:
                  print("error", sym, e)

          # send the alerts: several coins per notification, never too long
          sent = 0
          i = 0
          while i < len(blocks) and sent < MAX_MSGS:
              text, group = "", []
              while i < len(blocks) and (not group or len(text) + len(blocks[i][0]) + 1 <= MAX_CHARS):
                  text += blocks[i][0] + "\n"
                  group.append(blocks[i])
                  i += 1
              sent += 1
              if notify(text.strip()):  # only mark as done if the phone alert was sent
                  for _, pending, chks in group:
                      state.update(pending)
                      for c in chks:
                          state[c] = now_ms
          if i < len(blocks):
              print("not sent this run (will retry next run):", len(blocks) - i, "coins")

          # forget old alert records (older than 3 days)
          cutoff = now_ms - 3 * 86400000
          for k in list(state.keys()):
              v = state[k]
              if not k.startswith("_") and isinstance(v, (int, float)) and v < cutoff:
                  del state[k]

          json.dump(state, open("state.json", "w"))

          if os.environ.get("MANUAL") == "true":
              notify("GitHub RSI bot is working.\nWatching %d coins on 1h, trend on 4h and 1h.\n%s" % (len(SYMBOLS), sample))
          PY
