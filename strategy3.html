<script>

async function getBybitKlines(symbol, interval){

    const url =
    `https://api.bybit.com/v5/market/kline?category=linear&symbol=${symbol}&interval=${interval}&limit=100`;

    const response = await fetch(url);

    const json = await response.json();

    return json.result.list
        .reverse()
        .map(c => parseFloat(c[4]));

}

function calculateRSI(closes, period = 14){

    let gains = 0;
    let losses = 0;

    for(let i = 1; i <= period; i++){

        const diff = closes[i] - closes[i - 1];

        if(diff > 0)
            gains += diff;
        else
            losses -= diff;
    }

    let avgGain = gains / period;
    let avgLoss = losses / period;

    for(let i = period + 1; i < closes.length; i++){

        const diff = closes[i] - closes[i - 1];

        const gain = diff > 0 ? diff : 0;
        const loss = diff < 0 ? -diff : 0;

        avgGain = ((avgGain * (period - 1)) + gain) / period;
        avgLoss = ((avgLoss * (period - 1)) + loss) / period;
    }

    if(avgLoss === 0)
        return 100;

    const rs = avgGain / avgLoss;

    return 100 - (100 / (1 + rs));

}

async function getRSI(symbol, interval){

    const closes =
        await getBybitKlines(
            symbol,
            interval
        );

    return calculateRSI(closes);

}

async function strategy3(symbol){

    const rsi15 =
        await getRSI(symbol,"15");

    const rsi60 =
        await getRSI(symbol,"60");

    const rsi240 =
        await getRSI(symbol,"240");

    let signal = "NONE";

    if(
        rsi15 > 50 &&
        rsi60 > 50 &&
        rsi240 > 50
    ){
        signal = "ELITE";
    }
    else if(
        rsi15 > 50 &&
        rsi60 > 50
    ){
        signal = "STRONG";
    }
    else if(
        rsi15 > 50
    ){
        signal = "WATCH";
    }

    return {
        symbol,
        rsi15: rsi15.toFixed(2),
        rsi60: rsi60.toFixed(2),
        rsi240: rsi240.toFixed(2),
        signal
    };
}

async function runScanner(){

    const coins = [
        "BTCUSDT",
        "ETHUSDT",
        "SOLUSDT",
        "DOGEUSDT",
        "XRPUSDT"
    ];

    for(const coin of coins){

        const result =
            await strategy3(coin);

        console.log(result);

    }

}

runScanner();

</script>
